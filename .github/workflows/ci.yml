name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: 캡션 예외처리 검증
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: pip install build && python -m build

      - name: wheel 내용물 확인
        run: python -m zipfile -l dist/*.whl

      - name: Install wheel
        run: pip install dist/*.whl

      - name: 클린 디렉터리에서 import 검증
        run: cd /tmp && python -c "from evidence_chunker import SmartChunker, EvidenceUnit"

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + pip-audit
        run: pip install -e . pip-audit

      - name: pip-audit로 의존성 취약점 스캔
        run: pip-audit
