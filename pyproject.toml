[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-chunker"
version = "0.1.0"
description = "Docling 기반 Evidence Unit(표+캡션+컨텍스트) 청킹 - RAG 검색 성능 향상"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "osscontest" },
]

dependencies = [
    "docling>=2.0.0",
    "tiktoken>=0.7.0",
    "beautifulsoup4>=4.12",       # split.py — 이전에는 누락돼 있었음
]

[project.optional-dependencies]
similarity = ["sentence-transformers>=2.2"]
langchain = ["langchain-core"]
llamaindex = ["llama-index-core"]
dev = ["pytest>=8", "sentence-transformers>=2.2"]

[project.urls]
Repository = "https://github.com/osscontest/docling-evidence-chunker"

[tool.setuptools.packages.find]
where = ["src"]
